name: lab1

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: write
  packages: write

jobs:
  prepare:
      name: Lower repo_name and username
      runs-on: ubuntu-latest
      outputs:
        short_sha: ${{ steps.vars.outputs.short_sha }}
        repo: ${{ steps.vars.outputs.repo }}
      steps:
        - uses: actions/checkout@v4
        - name: Compute vars
          id: vars
          run: |
            echo "short_sha=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
            echo "repo=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT
  
  build-and-test-lab1:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run linter
        run: flake8 app tests

      - name: Run Unit tests
        run: python -m pytest tests/unit --cov=app.health --cov-report=term --cov-report=xml --cov-fail-under=80

      - name: Build
        run: python -m py_compile app/*.py

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage.xml
          if-no-files-found: ignore

  integration-tests-lab3:
    name: Integration tests
    needs: build-and-test-lab1
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'
          cache-dependency-path: requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run integration tests
        run: python -m pytest tests/integration -n auto --no-cov -v
  
  build-and-push:
    name: Build, scan, push image
    needs: [prepare, build-and-test-lab1, integration-tests-lab3]
    runs-on: ubuntu-latest
    
    steps:
      - uses: actions/checkout@v4 

      - name: Настройка Buildx     
        uses: docker/setup-buildx-action@v3
       
      - name: Сборка образа (без публикации) с кэшированием слоёв     
        uses: docker/build-push-action@v6     
        with:
          context: .
          file: Dockerfile.multi
          push: false
          load: true
          tags: myapp:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max 

      - name: Trivy artifact
        if: always()
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: myapp:${{ github.sha }}
          format: table
          output: trivy-report.txt
          severity: 'LOW,MEDIUM,HIGH,CRITICAL'
          ignore-unfixed: false
          exit-code: '0'

      - name: Upload Trivy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.txt
          if-no-files-found: warn

      - name: Trivy quality gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: myapp:${{ github.sha }}
          format: table
          severity: 'HIGH,CRITICAL'
          ignore-unfixed: true
          exit-code: '1'

      - name: Generate SBOM
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: myapp:${{ github.sha }}
          format: cyclonedx
          output: sbom.cdx.json
          exit-code: '0'

      - name: Upload SBOM
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.cdx.json

      - name: Log in to GitHub Container Registry
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag and push image to GHCR
        if: github.ref == 'refs/heads/main'
        run: |
          SRC="myapp:${{ github.sha }}"
          REGISTRY="ghcr.io/${{ needs.prepare.outputs.repo }}"
          TAG_SHA="${{ needs.prepare.outputs.short_sha }}"
          TAG_RUN="${{ github.run_number }}"

          echo "Source image: $SRC"

          docker tag "$SRC" "$REGISTRY:$TAG_SHA"
          docker tag "$SRC" "$REGISTRY:$TAG_RUN"

          docker push "$REGISTRY:$TAG_SHA"
          docker push "$REGISTRY:$TAG_RUN"

  promote-to-staging:
    name: Promote image to staging
    needs: [prepare, build-and-push]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Log in to GitHub Container Registry
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | \
            skopeo login ghcr.io -u ${{ github.actor }} --password-stdin

      - name: Copy image from prod to staging repo
        run: |
          SRC="docker://ghcr.io/${{ needs.prepare.outputs.repo }}:${{ needs.prepare.outputs.short_sha }}"
          DST="docker://ghcr.io/${{ needs.prepare.outputs.repo }}-staging:${{ needs.prepare.outputs.short_sha }}"
          echo "Copying $SRC -> $DST"
          skopeo copy "$SRC" "$DST"

      - name: Verify image in staging
        run: |
          TAG="${{ needs.prepare.outputs.short_sha }}"
          skopeo inspect "docker://ghcr.io/${{ needs.prepare.outputs.repo }}-staging:${TAG}" \
            | head -c 500

  update-manifest:
    name: Update staging K8s manifest
    needs: [prepare, promote-to-staging]
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Установка yq 
        run: |
          sudo wget https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -O /usr/local/bin/yq
          sudo chmod +x /usr/local/bin/yq

      - name: Обновление тега образа и коммит 
        run: |
          TAG="${{ needs.prepare.outputs.short_sha }}"
          REPO="${{ needs.prepare.outputs.repo }}"
          yq -i ".spec.template.spec.containers[0].image = \"ghcr.io/${REPO}-staging:${TAG}\"" \
            k8s-manifests/staging/deployment.yaml
          git config user.email "ci-bot@example.com"
          git config user.name "CI Bot"
          git add k8s-manifests/staging/deployment.yaml
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Deploy to staging"
            git push
          fi